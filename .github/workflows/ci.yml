name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock-linux.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock-linux.txt
      - name: Test without a real Telegram token
        run: python -m pytest -q

  docker:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production Dockerfile
        run: docker build --tag equipment-bot:ci .
      - name: Smoke-test web mode without Telegram
        run: |
          docker run -d --name equipment-bot-ci -p 127.0.0.1:18080:8080 \
            -e WEB_ADMIN_PASSWORD=ci-admin-only \
            -e WEB_SPECIALIST_PASSWORD=ci-specialist-only \
            -e WEB_SECRET_KEY=ci-session-key-only \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci-equipment.db \
            equipment-bot:ci python main.py web
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 2 --max-time 5 http://127.0.0.1:18080/login > /dev/null
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs equipment-bot-ci || true
          docker rm -f equipment-bot-ci || true
